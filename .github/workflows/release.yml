name: Build and Publish RC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

# To test workflow updates you need to work in a branch directly on viam-modules/numato-lab
# and tag your working branch instead of @main in any viam-modules/numato-lab "uses" below.
# Don't forget to tag back to @main before merge.

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    strategy:
      matrix:
        include:
          - arch: ubuntu-large
            image: ghcr.io/viamrobotics/rdk-devenv:amd64-cache
            platform: linux/amd64
            label: amd64
          - arch: github-linux-arm64-8core
            image: ghcr.io/viamrobotics/rdk-devenv:arm64-cache
            platform: linux/arm64
            label: arm64

    runs-on: ${{ matrix.arch }}
    container:
      image: ${{ matrix.image }}

    steps:
    # actions/checkout@v7.0.0
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

    - name: Set up Go
      # actions/setup-go@v6.5.0
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
      with:
        go-version: 1.23

    - name: Build module
      run: |
        sudo -u testbot bash -lc 'make module'

    - name: Upload numato-lab module to registry
      uses: viamrobotics/upload-module@main
      with:
        meta-path: meta.json
        module-path: bin/module.tar.gz
        platform: ${{ matrix.platform }}
        version: ${{ github.ref_name }}
        key-id: ${{ secrets.VIAM_DEV_API_KEY_ID }}
        key-value: ${{ secrets.VIAM_DEV_API_KEY }}
